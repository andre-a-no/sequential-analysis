site_name: sequential-analysis
site_description: Sequential statistical inference in Python -- SPRT, anytime-valid A/B tests, group sequential designs, change detection, Kalman and particle filters -- with checkpoints that resume exactly.
site_url: https://andre-a-no.github.io/sequential-analysis/
repo_url: https://github.com/andre-a-no/sequential-analysis
repo_name: andre-a-no/sequential-analysis
copyright: Copyright © 2026 Novikov Laboratories LLC. AGPL-3.0 or commercial license.
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.arithmatex: {generic: true}
hooks:
  - tools/mkdocs_hooks.py
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
extra:
  # The user guide is translated (docs/<code>/guide/); the hooks add the language selector and hreflang links
  translations:
    - {code: ru, lang: ru, name: Русский}
    - {code: zh, lang: zh, name: 简体中文}
    - {code: ja, lang: ja, name: 日本語}
    - {code: ko, lang: ko, name: 한국어}
    - {code: de, lang: de, name: Deutsch}
    - {code: fr, lang: fr, name: Français}
    - {code: es, lang: es, name: Español}
    - {code: it, lang: it, name: Italiano}
    - {code: pt-br, lang: pt-BR, name: Português (Brasil)}
    - {code: pl, lang: pl, name: Polski}
    - {code: tr, lang: tr, name: Türkçe}
    - {code: id, lang: id, name: Bahasa Indonesia}
    - {code: vi, lang: vi, name: Tiếng Việt}
    - {code: ar, lang: ar, name: العربية}
    - {code: fa, lang: fa, name: فارسی}
    - {code: hi, lang: hi, name: हिन्दी}
    - {code: ur, lang: ur, name: اردو}
    - {code: bn, lang: bn, name: বাংলা}
    - {code: te, lang: te, name: తెలుగు}
    - {code: mr, lang: mr, name: मराठी}
    - {code: ta, lang: ta, name: தமிழ்}
    - {code: th, lang: th, name: ไทย}
    - {code: tl, lang: tl, name: Filipino}
    - {code: sw, lang: sw, name: Kiswahili}
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - User guide:
      - Overview: guide/index.md
      - "Why can't I look at a p-value every day?": guide/peeking.md
      - Stop an A/B test early: guide/ab-testing.md
      - Confidence intervals you can monitor: guide/confidence-sequences.md
      - Wald's SPRT in Python: guide/sprt.md
      - Interim analyses of a clinical trial: guide/clinical-trials.md
      - Detect a change in a stream: guide/change-detection.md
      - Streams, checkpoints and crashes: guide/streaming.md
      - Compared with other libraries: guide/comparison.md
      - Frequently asked questions: guide/faq.md
      - Glossary: guide/glossary.md
  - Which method?: choosing.md
  - Tutorials:
      - A/B test, monitored continuously: tutorials/ab-test.md
      - Group sequential trial: tutorials/group-sequential.md
      - Survival trial, monitored after every event: tutorials/survival.md
      - Process monitoring and change detection: tutorials/monitoring.md
      - Regimes with hidden Markov models: tutorials/regimes.md
      - Forecasting, fixed and continuous training: tutorials/forecasting.md
      - Several series, lead, lag and pairs: tutorials/multivariate.md
      - A news stream and the market: tutorials/news.md
      - Volatility and value at risk: tutorials/volatility.md
      - A programme of experiments: tutorials/experiment-programme.md
  - Guides:
      - Checkpoints, logs and backends: checkpoints.md
      - Data sources: adapters.md
      - Plotting runs, designs and plans: plotting.md
      - TypeScript executor: typescript.md
  - Reference:
      - Methods: methods.md
      - Speed: performance.md
      - Specification of the formats: spec.md
      - Changelog: changelog.md
  - API:
      - Runs, delivery and topologies: reference/run.md
      - Sources and adapters: reference/sources.md
      - Sequential tests: reference/tests.md
      - Anytime-valid and nonparametric: reference/anytime.md
      - A/B tests: reference/ab.md
      - Change detection: reference/detection.md
      - Filters and smoothers: reference/filters.md
      - Forecasting: reference/forecasting.md
      - Several series and events: reference/multivariate.md
      - Volatility: reference/volatility.md
      - Design and planning: reference/design.md
